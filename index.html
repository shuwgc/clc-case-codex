            --primary-light: #2d9d5a;
            --primary-bg: #f0f7f2;
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {

        }

            margin-bottom: 32px;
            border-bottom: 4px solid var(--primary);

        .app-header h1 {

            font-weight: 700;
            color: var(--primary);
            letter-spacing: 2px;
        }
        .app-header h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #5a7a6a;
            margin-left: 12px;
            letter-spacing: 0;
        }
        .app-header .sub {
            margin-top: 8px;
            color: #3d5a4e;
            font-size: 1rem;
            opacity: 0.85;
        }
        .stats-badge {
            display: inline-block;
            margin-top: 12px;
            background: var(--primary);
            color: #fff;
            padding: 6px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ===== 搜索栏 ===== */
        .search-section {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
            background: #fff;
            padding: 20px 24px;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            align-items: center;
        }
        .search-section .search-group {
            flex: 1 1 280px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f2f6f4;
            border-radius: 60px;
            padding: 0 18px;
            transition: var(--transition);
            border: 2px solid transparent;
        }
        .search-section .search-group:focus-within {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(26, 127, 58, 0.12);
        }
        .search-section .search-group .icon {
            font-size: 1.2rem;
            opacity: 0.6;
        }
        .search-section .search-group input {
            border: none;
            background: transparent;
            padding: 14px 6px;
            font-size: 1rem;
            width: 100%;
            outline: none;
            font-family: var(--font);
            color: #1e2a2e;
        }
        .search-section .search-group input::placeholder {
            color: #8a9f96;
        }
        .search-section .search-group .clear-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #b0c4ba;
            padding: 4px 6px;
            transition: var(--transition);
            display: none;
        }
        .search-section .search-group .clear-btn.visible {
            display: block;
        }
        .search-section .search-group .clear-btn:hover {
            color: #e74c3c;
        }

        .search-section .mode-toggle {
            display: flex;
            gap: 4px;
            background: #edf3ef;
            border-radius: 40px;
            padding: 4px;
            flex-shrink: 0;
        }
        .search-section .mode-toggle button {
            border: none;
            background: transparent;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            color: #3d5a4e;
            font-family: var(--font);
        }
        .search-section .mode-toggle button.active {
            background: #fff;
            color: var(--primary);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        .search-section .mode-toggle button:hover:not(.active) {
            background: rgba(255, 255, 255, 0.4);
        }
        .search-section .result-count {
            margin-left: auto;
            font-size: 0.9rem;
            color: #4d6b5e;
            font-weight: 500;
            white-space: nowrap;
        }

        /* ===== 特征标签云（快速筛选） ===== */
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin: 6px 0 28px;
            padding: 8px 4px;
            align-items: center;
        }
        .tag-cloud .label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #4d6b5e;
            letter-spacing: 0.5px;
            margin-right: 4px;
        }
        .tag-cloud .tag {
            display: inline-block;
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            background: #e8f0ec;
            color: #1e4a34;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            user-select: none;
        }
        .tag-cloud .tag:hover {
            background: #d0e4da;
            transform: translateY(-1px);
        }

            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 2px 10px rgba(26, 127, 58, 0.25);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
            margin-top: 8px;
        }

        .project-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            transition: var(--transition);
            border: 1px solid #eaf1ed;
            display: flex;
            flex-direction: column;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.10);
            border-color: var(--primary-light);
        }

            padding: 18px 22px 12px;
            border-bottom: 1px solid #ecf3ef;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }
        .project-card .card-header .name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0e2a1e;
            line-height: 1.3;
            flex: 1;
        }
        .project-card .card-header .batch {
            font-size: 0.7rem;
            font-weight: 600;
            background: var(--primary-bg);
            color: var(--primary);

            border-radius: 30px;
            white-space: nowrap;
            border: 1px solid #cde0d5;
        }
        .project-card .card-body {
            padding: 14px 22px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .project-card .card-body .location {
            font-size: 0.85rem;
            color: #4d6b5e;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .project-card .card-body .location .pin {
            opacity: 0.6;
        }
        .project-card .card-body .invest {
            font-size: 0.85rem;
            color: #2d5a44;
            background: #f0f7f2;
            padding: 3px 14px;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
        }
        .project-card .card-body .desc {
            font-size: 0.92rem;
            line-height: 1.6;
            color: #2a3e34;
            margin: 4px 0 2px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .project-card .card-body .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 8px;
            margin-top: 6px;
            padding-top: 10px;
            border-top: 1px dashed #e0ebe4;
        }
        .project-card .card-body .tags .tag-item {
            font-size: 0.7rem;
            background: #f2f8f4;
            color: #1a4a32;
            padding: 2px 14px;
            border-radius: 30px;
            border: 1px solid #dce8e0;
            cursor: default;
            transition: var(--transition);
        }
        .project-card .card-body .tags .tag-item:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* ===== 空状态 ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #6a8a7a;
        }
        .empty-state .emoji {
            font-size: 3.2rem;
            margin-bottom: 16px;
            display: block;
        }
        .empty-state h3 {
            font-size: 1.3rem;
            color: #2a4a3a;
            margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 0.95rem;
            max-width: 460px;
            margin: 0 auto;
            opacity: 0.8;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 680px) {
            .app-header h1 {

                display: block;
                margin-left: 0;
                margin-top: 4px;
                font-size: 0.8rem;
            }
            .search-section {
                padding: 16px;
                flex-direction: column;
                align-items: stretch;
            }
            .search-section .search-group {
                flex: 1 1 auto;
            }
            .search-section .mode-toggle {
                align-self: center;
            }
            .search-section .result-count {
                margin-left: 0;
                text-align: center;
            }
            .card-grid {
                grid-template-columns: 1fr;
            }
            .tag-cloud .label {
                width: 100%;
                margin-bottom: 2px;
            }
            .project-card .card-header .name {
                font-size: 1rem;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #eaf1ed;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

            desc: '改良盐碱地2万余亩，建设高标准农田15503亩，土地流转费用从300元增至1000元以上，吸引社会资本1.642亿元，是2022年的46.6倍。',
            tags: ['盐碱地改良', '高标准农田', '土地流转增收', '社会资本引入', '节水农业', '现代农业']
        }];

        // ================================================================
        //  工具函数
        // ================================================================
        function getAllTags(projects) {
            const set = new Set();
            projects.forEach(p => p.tags.forEach(t => set.add(t)));
            return Array.from(set).sort();
        }

        // 提取特征关键词 (从 tags 中)
        function extractFeatures(projects) {
            const freq = {};
            projects.forEach(p => {
                p.tags.forEach(t => {
                    freq[t] = (freq[t] || 0) + 1;
                });
            });
            // 按频率排序，取前 30 个
            return Object.entries(freq)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 30)
                .map(([tag]) => tag);
        }

        // ================================================================
        //  渲染引擎
        // ================================================================
        let currentMode = 'project'; // 'project' | 'feature'
        let currentQuery = '';
        let activeTag = null;

        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const modeProject = document.getElementById('modeProject');
        const modeFeature = document.getElementById('modeFeature');
        const resultCount = document.getElementById('resultCount');
        const cardGrid = document.getElementById('cardGrid');
        const tagCloud = document.getElementById('tagCloud');
        const totalStats = document.getElementById('totalStats');

        // 渲染标签云
        function renderTagCloud() {
            const topTags = extractFeatures(PROJECTS);
            const html = `
                <span class="label">🏷️ 热门特征</span>
                ${topTags.map(tag => `
                    <span class="tag ${activeTag === tag ? 'active' : ''}" data-tag="${tag}">${tag}</span>
                `).join('')}
            `;
            tagCloud.innerHTML = html;
            // 绑定点击事件
            tagCloud.querySelectorAll('.tag').forEach(el => {
                el.addEventListener('click', () => {
                    const tag = el.dataset.tag;
                    if (activeTag === tag) {
                        activeTag = null;
                        currentQuery = '';
                        searchInput.value = '';
                    } else {
                        activeTag = tag;
                        currentQuery = tag;
                        searchInput.value = tag;
                        // 自动切换到特征模式
                        setMode('feature');
                    }
                    render();
                });
            });
        }

        // 设置模式
        function setMode(mode) {
            currentMode = mode;
            modeProject.classList.toggle('active', mode === 'project');
            modeFeature.classList.toggle('active', mode === 'feature');
            // 更新 placeholder
            if (mode === 'project') {
                searchInput.placeholder = '输入项目名称…';
            } else {
                searchInput.placeholder = '输入特征关键词…';
            }
            // 清除激活的标签（如果切换到项目模式）
            if (mode === 'project') {
                activeTag = null;
                renderTagCloud();
            }
            render();
        }

        // 核心搜索 & 渲染
        function render() {
            const query = currentQuery.trim().toLowerCase();
            let results = [];

            if (currentMode === 'project') {
                // 项目模式：按名称匹配
                if (!query) {
                    results = PROJECTS;
                } else {
                    results = PROJECTS.filter(p =>
                        p.name.toLowerCase().includes(query) ||
                        p.province.toLowerCase().includes(query) ||
                        p.tags.some(t => t.toLowerCase().includes(query))
                    );
                }
            } else {
                // 特征模式：按特征标签匹配
                if (!query) {
                    results = PROJECTS;
                } else {
                    results = PROJECTS.filter(p =>
                        p.tags.some(t => t.toLowerCase().includes(query))
                    );
                }
            }

            // 如果有激活的标签，进一步过滤
            if (activeTag) {
                results = results.filter(p => p.tags.includes(activeTag));
            }

            // 更新统计
            resultCount.textContent = `显示 ${results.length} 个项目`;
            totalStats.textContent = `共 ${PROJECTS.length} 个项目`;

            // 渲染卡片
            if (results.length === 0) {
                cardGrid.innerHTML = `
                    <div class="empty-state">
                        <span class="emoji">🔎</span>
                        <h3>没有找到匹配的项目</h3>
                        <p>试试其他关键词，或点击特征标签快速筛选</p>
                    </div>
                `;
                return;
            }

            cardGrid.innerHTML = results.map(p => `
                <div class="project-card">
                    <div class="card-header">
                        <span class="name">${p.name}</span>
                        <span class="batch">${p.batch}</span>
                    </div>
                    <div class="card-body">
                        <div class="location">
                            <span class="pin">📍</span> ${p.province}
                            ${p.invest !== '—' ? ` · <span class="invest">💰 ${p.invest}</span>` : ''}
                        </div>
                        <div class="desc">${p.desc}</div>
                        <div class="tags">
                            ${p.tags.map(t => `<span class="tag-item">${t}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ================================================================
        //  事件绑定
        // ================================================================

        // 输入框搜索
        searchInput.addEventListener('input', () => {
            const val = searchInput.value;
            currentQuery = val;
            // 如果当前是项目模式，但输入了特征词，自动切换？ 不自动切换，保持模式
            // 但如果输入了内容，清除激活标签
            if (activeTag && val !== activeTag) {
                activeTag = null;
                renderTagCloud();
            }
            // 如果输入为空，清除激活标签
            if (!val) {
                activeTag = null;
                renderTagCloud();
            }
            clearBtn.classList.toggle('visible', val.length > 0);
            render();
        });

        // 清空按钮
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            currentQuery = '';
            activeTag = null;
            clearBtn.classList.remove('visible');
            renderTagCloud();
            render();
            searchInput.focus();
        });

        // 模式切换
        modeProject.addEventListener('click', () => {
            if (currentMode === 'project') return;
            setMode('project');
            // 清除激活标签
            activeTag = null;
            renderTagCloud();
            // 如果输入框内容不是项目名，清空
            const val = searchInput.value.trim();
            if (val && !PROJECTS.some(p => p.name.includes(val))) {
                searchInput.value = '';
                currentQuery = '';
            }
            render();
        });

        modeFeature.addEventListener('click', () => {
            if (currentMode === 'feature') return;
            setMode('feature');
        });

        // ================================================================
        //  初始化
        // ================================================================
        function init() {
            renderTagCloud();
            setMode('project');
            // 显示所有项目
            currentQuery = '';
            searchInput.value = '';
            render();
            // 统计信息
            totalStats.textContent = `共 ${PROJECTS.length} 个项目`;
        }

        init();

        // 键盘快捷键: ESC 清空
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchInput.value = '';
                currentQuery = '';
                activeTag = null;
                clearBtn.classList.remove('visible');
                renderTagCloud();
                render();
                searchInput.blur();
            }
        });

        console.log('🌾 全域土地综合整治案例库已加载，共 ' + PROJECTS.length + ' 个项目');
        console.log('💡 支持按项目名称或特征关键词检索');
    </script>
</body>
</html>
